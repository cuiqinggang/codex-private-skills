function project(o){const sx=Math.sin(rotX),cx=Math.cos(rotX),sy=Math.sin(rotY),cy=Math.cos(rotY);let x=o.x,y=o.y,z=o.z;let y1=y*cx-z*sx,z1=y*sx+z*cx;let x2=x*cy+z1*sy,z2=-x*sy+z1*cy;let s=(.92+Math.max(-.06,Math.min(.06,z2/5200)))*zoom;return{x:W/2+x2*s,y:H/2-18+y1*s,z:z2,s}}

function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="rgba(23,23,23,.96)";ctx.fillRect(0,0,W,H);const P=new Map(nodes.map(o=>[o,project(o)]));links.slice().sort((a,b)=>P.get(a.a).z+P.get(a.b).z-P.get(b.a).z-P.get(b.b).z).forEach(e=>{let a=P.get(e.a),b=P.get(e.b),active=selected&&(e.a===selected||e.b===selected)||searchHits.has(e.a)||searchHits.has(e.b);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=active?"rgba(255,255,255,.62)":e.k==="bridge"?"rgba(235,235,235,.34)":e.k==="mesh"?"rgba(220,225,230,.11)":"rgba(220,225,230,.17)";ctx.lineWidth=active?1.45:e.k==="bridge"?1.15:e.k==="mesh"?.5:.66;ctx.stroke()});nodes.slice().sort((a,b)=>P.get(a).z-P.get(b).z).forEach(o=>{let p=P.get(o),hit=o===selected||searchHits.has(o),r=(o.r+(hit?3.2:0))*p.s;ctx.globalAlpha=(searchHits.size&&!hit&&!o.show) ? .46 : .98;if(hit){ctx.beginPath();ctx.arc(p.x,p.y,r+8,0,Math.PI*2);ctx.fillStyle=o.c+"33";ctx.fill();ctx.strokeStyle=o.c;ctx.lineWidth=1.4;ctx.stroke()}ctx.shadowColor=o.c;ctx.shadowBlur=hit?14:0;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=o.c;ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=hit?2:.45;ctx.strokeStyle=hit?"rgba(255,255,255,.95)":"rgba(255,255,255,.14)";ctx.stroke()});nodes.filter(o=>o===selected||searchHits.has(o)||(!drag&&o.show)).slice(0,36).forEach(o=>{let p=P.get(o),r=(o.r+(o===selected||searchHits.has(o)?3:0))*p.s;ctx.globalAlpha=.98;ctx.font=`${Math.max(11,o.show?15*p.s:12)}px Microsoft YaHei,Segoe UI`;ctx.textAlign="center";ctx.textBaseline="middle";let text=o.label,w=ctx.measureText(text).width+15,h=24,x=p.x,y=p.y+r+28;ctx.fillStyle="rgba(8,12,14,.58)";ctx.strokeStyle=(o===selected||searchHits.has(o))?"rgba(255,255,255,.92)":"rgba(255,255,255,.24)";ctx.lineWidth=1;roundRect(x-w/2,y-h/2,w,h,8);ctx.fill();ctx.stroke();ctx.fillStyle="#f4fbff";ctx.fillText(text,x,y+1)});ctx.globalAlpha=1}
