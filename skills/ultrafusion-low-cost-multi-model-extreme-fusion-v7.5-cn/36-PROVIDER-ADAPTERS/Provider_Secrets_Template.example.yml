# UltraFusion Provider 密钥配置模板
# 不包含真实凭据，仅保存模板

providers:
  deepseek:
${REDACTED_SECRET}
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
  
  minimax:
${REDACTED_SECRET}
    group_id: "YOUR_GROUP_ID"
    model: "minimax-m2.7"
  
  qwen:
${REDACTED_SECRET}
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen3.5-flash"
  
  kimi:
${REDACTED_SECRET}
    model: "kimi-k2"
  
  gemini:
${REDACTED_SECRET}
    model: "gemini-2.5-pro"
  
  glm:
${REDACTED_SECRET}
    model: "glm-4.5"
  
  ernie:
${REDACTED_SECRET}
    secret_key: "YOUR_ERNIE_SECRET"
    model: "ernie-4.0"
  
  pangu:
${REDACTED_SECRET}
    model: "pangu-5.0"

# GPT 官方套餐（浏览器自动化，不需要 API key）
gpt:
  type: "official_subscription"
  automation: "browser"
