# UltraFusion Provider 密钥配置模板
# 不包含真实凭据，仅保存模板

providers:
  deepseek:
    api_key: "sk-YOUR_DEEPSEEK_KEY"
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-pro"
  
  minimax:
    api_key: "YOUR_MINIMAX_KEY"
    group_id: "YOUR_GROUP_ID"
    model: "minimax-m2.7"
  
  qwen:
    api_key: "sk-YOUR_QWEN_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen3.5-flash"
  
  kimi:
    api_key: "sk-YOUR_KIMI_KEY"
    model: "kimi-k2"
  
  gemini:
    api_key: "YOUR_GEMINI_KEY"
    model: "gemini-2.5-pro"
  
  glm:
    api_key: "YOUR_GLM_KEY"
    model: "glm-4.5"
  
  ernie:
    api_key: "YOUR_ERNIE_KEY"
    secret_key: "YOUR_ERNIE_SECRET"
    model: "ernie-4.0"
  
  pangu:
    api_key: "YOUR_PANGU_KEY"
    model: "pangu-5.0"

# GPT 官方套餐（浏览器自动化，不需要 API key）
gpt:
  type: "official_subscription"
  automation: "browser"
