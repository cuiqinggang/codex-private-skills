name: Windows GitHub Bridge v0.3.4 Smoke Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-github-bridge-v034-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-direct:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Benchmark local computation without downloads
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $timer=[Diagnostics.Stopwatch]::StartNew()
          [long]$total=0
          for($i=0;$i -lt 100000;$i++){ $total += $i }
          $timer.Stop()
          if($total -ne 4999950000){throw 'COMPUTATION_MISMATCH'}
          Write-Host ('BRIDGE_V034_MINIMAL_PASS;HOST='+$env:COMPUTERNAME+';RUNNER='+$env:RUNNER_NAME+';RUN_ID='+$env:GITHUB_RUN_ID+';COMPUTE_MS='+[math]::Round($timer.Elapsed.TotalMilliseconds,3)+';UTC='+[DateTime]::UtcNow.ToString('o'))
