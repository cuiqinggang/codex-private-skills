name: Douyin repair 20261016 R1 (existing B lane)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/douyin-repair-20261016-r1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: douyin-repair-20261016-r1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - name: Bounded full task validation with automatic original-source rollback
        shell: pwsh
        env:
          RUN_SOURCE: ''
          SEEKIN_SOURCE: ''
          TEST_SOURCE: ''
          REPAIR_NODE: ''
        run: |
          & 'C:\Program Files\nodejs\node.exe' -e "eval(Buffer.from(process.env.REPAIR_NODE,'base64').toString('utf8'))"
          if($LASTEXITCODE -ne 0){throw 'REPAIR_FAILED_AND_ORIGINAL_RESTORED'}
