name: Douyin repair 20261016 R1 (existing B lane)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/douyin-repair-20261016-r1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: douyin-repair-20261016-r1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - name: Deploy reviewed repair and verify the same video
        shell: cmd
        env:
          RUN_SOURCE: ''
          SEEKIN_SOURCE: ''
          TEST_SOURCE: ''
          REPAIR_EXECUTOR: ''
        run: C:\Users\A\AppData\Local\Programs\Python\Python313\python.exe -X utf8 -c "import os,base64;exec(base64.b64decode(os.environ['REPAIR_EXECUTOR']))"
