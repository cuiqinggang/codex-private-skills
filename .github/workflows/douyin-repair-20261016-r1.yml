name: Douyin repair 20261016 R1 (existing B lane)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/douyin-repair-20261016-r1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: douyin-repair-20261016-r1
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 2
    steps:
      - name: Reconcile unchanged source and interpreter access
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Write-Host ('IDENTITY='+[Security.Principal.WindowsIdentity]::GetCurrent().Name)
          Write-Host ('PWSH='+$PSVersionTable.PSVersion)
          $p='C:\AI\Douyin-Ultra-Direct\run.py'
          Write-Host ('RUN_HASH='+(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash)
          $receipt='C:\AI\Douyin-Ultra-Direct\repair-b-20261016-r1.json'
          if(Test-Path -LiteralPath $receipt){Write-Host ([IO.File]::ReadAllText($receipt))}
          Get-Command python.exe,python3.exe,py.exe,node.exe -ErrorAction SilentlyContinue | Select-Object Name,Source | ConvertTo-Json -Compress | Write-Host
          foreach($exe in @('C:\Users\A\AppData\Local\Programs\Python\Python313\python.exe','C:\Program Files\nodejs\node.exe','C:\AI\ComfyUI_Aaki_v3\python\python.exe','C:\AI\ComfyUI_Aaki_v3\python_embeded\python.exe')){
            if(Test-Path -LiteralPath $exe){try{Write-Host ('EXE='+$exe); & $exe --version; Write-Host ('EXIT='+$LASTEXITCODE)}catch{Write-Host ('START_ERROR='+$_.Exception.Message)}}
          }
