name: Hermes existing startup recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/hermes-existing-startup-recovery.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Restore existing startup entries without checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $name='Hermes8642SilentHealthCheck'
          $root='C:\Users\A\Hermes_AutoStart\openwebui-autoopen'
          $startup='C:\Users\A\AppData\Roaming\Microsoft\Windows\Start Menu\Programs\Startup\HermesOpenWebUIAutoOpen.vbs'
          $source=Join-Path $root 'Run-HermesOpenWebUIAutoOpen.vbs'
          $script=Join-Path $root 'Open-HermesOpenWebUI.ps1'
          if($env:USERNAME -ne 'A'){throw 'Interactive user A required; no startup writes performed.'}
          foreach($p in @($source,$script)){if(-not(Test-Path -LiteralPath $p)){throw "Missing existing source: $p"}}
          $t=Get-ScheduledTask -TaskName $name
          if(-not $t.Settings.Enabled){Enable-ScheduledTask -TaskName $name | Out-Null}
          $t=Get-ScheduledTask -TaskName $name
          if([string]$t.State -ne 'Running'){
            $port=@(Get-NetTCPConnection -LocalPort 8642 -State Listen -ErrorAction SilentlyContinue)
            if(-not $port.Count){Start-ScheduledTask -TaskName $name}
          }
          if(-not(Test-Path -LiteralPath $startup)){
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'Install-HermesOpenWebUIAutoOpen.ps1')
            if($LASTEXITCODE -ne 0){throw 'Original startup installer failed'}
          }
          Start-Process -FilePath 'wscript.exe' -ArgumentList ('"'+$source+'"')
          $e=[ordered]@{at=(Get-Date).ToString('o');user=$env:USERNAME;sessionId=(Get-Process -Id $PID).SessionId;taskEnabled=(Get-ScheduledTask -TaskName $name).Settings.Enabled;startupExists=(Test-Path -LiteralPath $startup);originalWebWrapperInvoked=$true;checkoutUsed=$false;rebootTested=$false}
          $e | ConvertTo-Json -Compress | Write-Host
          $deadline=(Get-Date).AddSeconds(150)
          while((Get-Date) -lt $deadline){
            $p='C:\Users\A\.hermes\logs\hermes-openwebui-autoopen-status.json'
            if(Test-Path -LiteralPath $p){
              $s=Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
              if([datetime]$s.time -ge (Get-Date).AddMinutes(-4)){
                @{wrapperTime=$s.time;result=$s.result} | ConvertTo-Json -Compress | Write-Host
                if($s.result -eq 'FINAL_PASS'){break}
              }
            }
            Start-Sleep -Seconds 10
          }
          Get-Process chrome,msedge -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowTitle -like '*Open WebUI*'} | Select-Object ProcessName,MainWindowTitle | ConvertTo-Json -Compress | Write-Host
