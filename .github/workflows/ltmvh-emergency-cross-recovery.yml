name: LTMVH Emergency Cross-Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltmvh-emergency-cross-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Revive DCR and write local evidence without checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\AI\LTMVH-Recovery'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dcrScript='C:\Users\A\AppData\Local\DesktopCommanderRemote\Start-DesktopCommanderRemote.ps1'
          $before=@(Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -match 'desktop-commander.*remote|Start-DesktopCommanderRemote'}).Count
          if($before -eq 0 -and (Test-Path $dcrScript)){
            Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$dcrScript
            Start-Sleep -Seconds 10
          }
          $after=@(Get-CimInstance Win32_Process | Where-Object {$_.CommandLine -match 'desktop-commander.*remote|Start-DesktopCommanderRemote'}).Count
          $runner=@(Get-CimInstance Win32_Process | Where-Object {$_.Name -match 'RunnerService|Runner.Listener'}).Count
          $browser=@(Get-CimInstance Win32_Process | Where-Object {$_.Name -eq 'chrome.exe' -and $_.ExecutablePath -like '*ms-playwright*'}).Count
          $port=@(Get-NetTCPConnection -LocalPort 9223 -State Listen -ErrorAction SilentlyContinue).Count
          $obj=[ordered]@{schemaVersion=1;evidenceId='LTMVH-CROSS-RECOVERY-R18';at=(Get-Date).ToString('o');machine=$env:COMPUTERNAME;runnerName=$env:RUNNER_NAME;checkoutUsed=$false;dcrBefore=$before;dcrAfter=$after;runnerProcesses=$runner;dedicatedBrowserProcesses=$browser;cdp9223ListenCount=$port;status=if($after -gt 0){'PASS'}else{'DCR_NOT_RECOVERED'}}
          $json=$obj | ConvertTo-Json -Depth 4
          $json | Set-Content -LiteralPath (Join-Path $root 'CROSS-RECOVERY-R18.json') -Encoding UTF8
          $json | Write-Host
