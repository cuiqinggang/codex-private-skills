name: LTMVH Emergency Cross-Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltmvh-emergency-cross-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Revive DCR without checkout or WMI
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\AI\LTMVH-Recovery'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dcrScript='C:\Users\A\AppData\Local\DesktopCommanderRemote\Start-DesktopCommanderRemote.ps1'
          $dcrLog='C:\Users\A\AppData\Local\DesktopCommanderRemote\remote.log'
          $beforeLog=if(Test-Path $dcrLog){(Get-Item $dcrLog).LastWriteTimeUtc}else{$null}
          $attempted=$false
          if(Test-Path $dcrScript){
            $attempted=$true
            Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$dcrScript
          }
          Start-Sleep -Seconds 12
          $afterLog=if(Test-Path $dcrLog){(Get-Item $dcrLog).LastWriteTimeUtc}else{$null}
          $runnerService=@(Get-Process -Name RunnerService -ErrorAction SilentlyContinue).Count
          $runnerListener=@(Get-Process -Name Runner.Listener -ErrorAction SilentlyContinue).Count
          $chrome=@(Get-Process -Name chrome -ErrorAction SilentlyContinue | Where-Object {$_.Path -like '*ms-playwright*'}).Count
          $logTail=if(Test-Path $dcrLog){(Get-Content $dcrLog -Tail 30 -ErrorAction SilentlyContinue) -join [Environment]::NewLine}else{''}
          $onlineEvidence=($logTail -match 'Device marked as online|Status:\s*Online|Desktop Commander Remote is connected')
          $obj=[ordered]@{schemaVersion=1;evidenceId='LTMVH-CROSS-RECOVERY-R18B';at=(Get-Date).ToString('o');machine=$env:COMPUTERNAME;runnerName=$env:RUNNER_NAME;checkoutUsed=$false;wmiUsed=$false;dcrStartScriptExists=(Test-Path $dcrScript);dcrStartAttempted=$attempted;dcrLogBefore=$beforeLog;dcrLogAfter=$afterLog;dcrOnlineEvidence=$onlineEvidence;runnerServiceCount=$runnerService;runnerListenerCount=$runnerListener;dedicatedChromeProcessCount=$chrome;status=if($onlineEvidence){'PASS'}else{'DCR_RECOVERY_UNCONFIRMED'}}
          $json=$obj | ConvertTo-Json -Depth 4
          $json | Set-Content -LiteralPath (Join-Path $root 'CROSS-RECOVERY-R18B.json') -Encoding UTF8
          $json | Write-Host
