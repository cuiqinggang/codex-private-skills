name: Extreme Time Windows Autonomous Bridge

on:
  push:
    branches: [main]
    paths:
      - 'workspaces/extreme-time-automation-loop-v2.0/bridge/**'
      - 'skills/extreme-time-automation-bridge/**'
      - '.github/workflows/extreme-time-windows-bridge.yml'
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Repository-relative task JSON path'
        required: false
        type: string

permissions:
  contents: read

jobs:
  contract-static:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.discover.outputs.should_run }}
      task_file: ${{ steps.discover.outputs.task_file }}
      task_id: ${{ steps.discover.outputs.task_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            .github/workflows/extreme-time-windows-bridge.yml
            workspaces/extreme-time-automation-loop-v2.0/bridge
            skills/extreme-time-automation-bridge

      - name: Parse bridge PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files = Get-ChildItem 'workspaces/extreme-time-automation-loop-v2.0/bridge' -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; throw "Parse failed: $($file.FullName)" }
          }
          $bootstrap = Get-ChildItem 'skills/extreme-time-automation-bridge/bootstrap' -Filter *.ps1 -ErrorAction SilentlyContinue
          foreach ($file in $bootstrap) {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { $errors | Format-List | Out-String | Write-Error; throw "Parse failed: $($file.FullName)" }
          }
          Write-Host 'BRIDGE_STATIC_PARSE_PASS'

      - name: Validate task contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tasks = Get-ChildItem 'workspaces/extreme-time-automation-loop-v2.0/bridge/tasks' -Filter *.json
          foreach ($f in $tasks) {
            $t = Get-Content $f.FullName -Raw | ConvertFrom-Json
            if ($t.schema_version -ne 1) { throw "Bad schema: $($f.Name)" }
            if (-not $t.task_id -or -not $t.payload_path) { throw "Missing fields: $($f.Name)" }
            if (-not (Test-Path -LiteralPath $t.payload_path)) { throw "Missing payload: $($t.payload_path)" }
          }
          Write-Host 'BRIDGE_TASK_CONTRACT_PASS'

      - name: Discover whether this event contains one executable task
        id: discover
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TASK: ${{ inputs.task_file }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          $task = $env:MANUAL_TASK

          if ([string]::IsNullOrWhiteSpace($task) -and $env:EVENT_NAME -eq 'push') {
            $changed = @(git diff --name-only $env:BEFORE_SHA $env:CURRENT_SHA | Where-Object {
              $_ -like 'workspaces/extreme-time-automation-loop-v2.0/bridge/tasks/*.json'
            })
            if ($changed.Count -gt 1) { throw 'Exactly one task JSON may be added/changed per dispatch commit.' }
            if ($changed.Count -eq 1) { $task = $changed[0] }
          }

          if ([string]::IsNullOrWhiteSpace($task)) {
            "should_run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host 'STATIC_ONLY: no task JSON changed; self-hosted runner will not be scheduled.'
            exit 0
          }

          if ($task -notlike 'workspaces/extreme-time-automation-loop-v2.0/bridge/tasks/*.json') {
            throw 'task_file must be inside bridge/tasks.'
          }
          if (-not (Test-Path -LiteralPath $task)) { throw "Task file not found: $task" }

          $id = (Get-Content -LiteralPath $task -Raw | ConvertFrom-Json).task_id
          "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "task_file=$task" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "task_id=$id" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "TASK_READY $id"

  windows-reality:
    needs: contract-static
    if: needs.contract-static.outputs.should_run == 'true'
    runs-on: [self-hosted, Windows, X64]
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    timeout-minutes: 1440
    concurrency:
      group: extreme-time-windows-reality
      cancel-in-progress: false
    steps:
      - name: Read frozen bridge files through GitHub Contents API
        shell: pwsh
        env:
          BRIDGE_READ_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          BRIDGE_TASK_PATH: ${{ needs.contract-static.outputs.task_file }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{Authorization="Bearer $env:BRIDGE_READ_TOKEN";Accept='application/vnd.github+json'}
          function Read-FrozenFile([string]$relative) {
            if($relative -notmatch '^workspaces/extreme-time-automation-loop-v2[.]0/bridge/(tasks|payloads|runner)/[A-Za-z0-9._-]+[.](json|ps1)$') {
              throw "Invalid bridge file path: $relative"
            }
            $uri="$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/${relative}?ref=$env:SOURCE_SHA"
            $response=$null
            for($attempt=1;$attempt -le 3;$attempt++){
              try{$response=Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 30;break}
              catch{if($attempt -eq 3){throw};Write-Host "Retry frozen file $relative ($attempt/3)";Start-Sleep -Seconds 2}
            }
            if($response.type -ne 'file' -or $response.encoding -ne 'base64'){throw 'Unsupported Contents response'}
            $destination=Join-Path 'etal' $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
            [IO.File]::WriteAllBytes($destination,[Convert]::FromBase64String($response.content))
            return $destination
          }
          $taskLocal=Read-FrozenFile $env:BRIDGE_TASK_PATH
          $task=Get-Content $taskLocal -Raw -Encoding utf8 | ConvertFrom-Json
          Read-FrozenFile $task.payload_path | Out-Null
          Read-FrozenFile 'workspaces/extreme-time-automation-loop-v2.0/bridge/runner/Invoke-BridgeTask.ps1' | Out-Null
          Write-Host "FROZEN_BRIDGE_FILES_READY SHA=$env:SOURCE_SHA"

      - name: Execute task through decisionless bridge
        shell: pwsh
        env:
          RESULT_DIR: ${{ runner.temp }}\\etal-bridge-result
          TASK_FILE: etal\${{ needs.contract-static.outputs.task_file }}
        run: |
          & 'etal\workspaces\extreme-time-automation-loop-v2.0\bridge\runner\Invoke-BridgeTask.ps1' -TaskFile $env:TASK_FILE -ResultDir $env:RESULT_DIR

      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etal-bridge-${{ needs.contract-static.outputs.task_id }}-${{ github.run_id }}
          path: ${{ runner.temp }}\\etal-bridge-result
          if-no-files-found: error
          retention-days: 30

      - name: Optional callback to orchestrator
        if: always()
        shell: pwsh
        env:
          CALLBACK_URL: ${{ secrets.ETAL_BRIDGE_CALLBACK_URL }}
          RESULT_FILE: ${{ runner.temp }}\\etal-bridge-result\\result.json
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CALLBACK_URL)) {
            Write-Host 'ETAL_BRIDGE_CALLBACK_URL not configured; evidence remains in Actions artifact.'
            exit 0
          }
          if (-not (Test-Path -LiteralPath $env:RESULT_FILE)) { throw 'result.json missing; callback aborted.' }
          Invoke-RestMethod -Uri $env:CALLBACK_URL -Method Post -ContentType 'application/json' -Body (Get-Content $env:RESULT_FILE -Raw)
