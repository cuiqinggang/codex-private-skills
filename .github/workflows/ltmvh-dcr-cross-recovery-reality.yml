name: LTMVH DCR Cross-Recovery Reality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltmvh-dcr-cross-recovery-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Probe backup-semantic access to DCR startup script
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Write-Host '=== PRIVILEGES ==='
          whoami /priv
          Write-Host '=== ACL ==='
          icacls 'C:\Users\A\AppData\Local\DesktopCommanderRemote'
          Write-Host '=== ROBOCOPY BACKUP ==='
          $dst='C:\AI\LTMVH-Recovery\dcr-script-backup-read'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          robocopy 'C:\Users\A\AppData\Local\DesktopCommanderRemote' $dst 'Start-DesktopCommanderRemote.ps1' /B /R:0 /W:0 /NFL /NDL /NJH /NJS
          Write-Host ('ROBOCOPY_EXIT='+$LASTEXITCODE)
          if(Test-Path (Join-Path $dst 'Start-DesktopCommanderRemote.ps1')){
            Write-Host 'BACKUP_READ=PASS'
            Get-Content (Join-Path $dst 'Start-DesktopCommanderRemote.ps1') -Raw
          } else {
            Write-Host 'BACKUP_READ=FAIL'
          }
