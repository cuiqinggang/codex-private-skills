name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect A-session recovery watchdog supervision
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $pidTarget=16764
          Write-Host '=== WATCHDOG PROCESS ==='
          Get-CimInstance Win32_Process -Filter "ProcessId=$pidTarget" |
            Select-Object ProcessId,ParentProcessId,SessionId,Name,ExecutablePath,CommandLine | Format-List
          Write-Host '=== WATCHDOG GET-PROCESS ==='
          try { Get-Process -Id $pidTarget -IncludeUserName | Select-Object Id,SessionId,UserName,Path,StartTime | Format-List } catch { Write-Host ('GETPROCESS_ERROR='+$_.Exception.Message) }
          $p=Get-CimInstance Win32_Process -Filter "ProcessId=$pidTarget" -ErrorAction SilentlyContinue
          if($p){
            Write-Host '=== PARENT ==='
            Get-CimInstance Win32_Process -Filter ("ProcessId="+$p.ParentProcessId) |
              Select-Object ProcessId,ParentProcessId,SessionId,Name,ExecutablePath,CommandLine | Format-List
          }
          Write-Host '=== SCHEDULED TASK ACTION MATCHES ==='
          Get-ScheduledTask -ErrorAction SilentlyContinue | ForEach-Object {
            $t=$_
            foreach($a in @($t.Actions)){
              $s=($a.Execute+' '+$a.Arguments)
              if($s -match 'LTMVH-Recovery|Recovery-Request-Watchdog|Recover-LTMVH'){
                [pscustomobject]@{TaskName=$t.TaskName;TaskPath=$t.TaskPath;State=$t.State;User=$t.Principal.UserId;LogonType=$t.Principal.LogonType;Action=$s}
              }
            }
          } | Format-List
          Write-Host '=== STARTUP MATCHES ==='
          Get-CimInstance Win32_StartupCommand -ErrorAction SilentlyContinue |
            Where-Object {$_.Command -match 'LTMVH-Recovery|Recovery-Request-Watchdog|Recover-LTMVH'} |
            Select-Object Name,Command,Location,User | Format-List
          Write-Host '=== RECOVERY DIR ==='
          Get-ChildItem 'C:\AI\LTMVH-Recovery' -Force -ErrorAction SilentlyContinue |
            Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
