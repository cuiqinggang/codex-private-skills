name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Final root-cause probes
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Write-Host '=== VERSION ==='
          node --version
          npm view '@wonderwhy-er/desktop-commander' version
          Write-Host '=== CDP ==='
          try {
            $r=Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 'http://127.0.0.1:9223/json/version'
            Write-Host ('CDP_9223=PASS status='+$r.StatusCode)
            Write-Host $r.Content
          } catch { Write-Host ('CDP_9223=FAIL '+$_.Exception.Message) }
          Write-Host '=== SESSION1 PROCESS TIMES ==='
          foreach($id in @(16628,4444,236,20848,21444,8988,16764)){
            try {
              $p=Get-Process -Id $id -ErrorAction Stop
              Write-Host ("PID={0} NAME={1} SESSION={2} START={3:o}" -f $p.Id,$p.ProcessName,$p.SessionId,$p.StartTime)
            } catch { Write-Host ("PID={0} NOT_FOUND_OR_DENIED" -f $id) }
          }
          Write-Host '=== TCP BY CANDIDATE PIDS ==='
          foreach($id in @(236,21444,8988,12844,14716,5072)){
            try {
              Get-NetTCPConnection -OwningProcess $id -ErrorAction Stop |
                Select-Object OwningProcess,State,LocalAddress,LocalPort,RemoteAddress,RemotePort | Format-Table -AutoSize
            } catch {}
          }
          Write-Host '=== NPM CACHE ACCESS ==='
          try {
            Get-ChildItem 'C:\Users\A\AppData\Local\npm-cache\_npx' -Directory -ErrorAction Stop |
              Sort-Object LastWriteTime -Descending | Select-Object -First 8 Name,LastWriteTime | Format-Table -AutoSize
          } catch { Write-Host ('NPM_CACHE_ACCESS=FAIL '+$_.Exception.Message) }
          Write-Host '=== DCR ENDPOINT ==='
          try {
            $r=Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'https://mcp.desktopcommander.app/api/mcp-info'
            Write-Host ('MCP_INFO=PASS status='+$r.StatusCode)
          } catch { Write-Host ('MCP_INFO=FAIL '+$_.Exception.Message) }
