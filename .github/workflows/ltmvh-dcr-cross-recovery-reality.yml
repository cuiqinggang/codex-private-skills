name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Dump raw 4104 fields for failed DCR launch window
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $start=[datetime]'2026-10-03T22:09:30'
          $end=[datetime]'2026-10-03T22:11:20'
          $ev=Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-PowerShell/Operational';Id=4104;StartTime=$start;EndTime=$end} -ErrorAction SilentlyContinue
          Write-Host ('COUNT='+@($ev).Count)
          foreach($e in $ev){
            $vals=@($e.Properties | ForEach-Object {$_.Value})
            Write-Host '--- EVENT ---'
            Write-Host ('TIME='+$e.TimeCreated.ToString('o'))
            Write-Host ('PROPS='+($vals | ConvertTo-Json -Compress -Depth 3))
            Write-Host ('MSG='+$e.Message)
          }
