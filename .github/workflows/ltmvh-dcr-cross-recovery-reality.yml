name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect PowerShell script-block evidence for DCR startup
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $logs=@('Microsoft-Windows-PowerShell/Operational','Windows PowerShell')
          foreach($ln in $logs){
            Write-Host ("=== LOG "+$ln+" ===")
            try {
              Get-WinEvent -FilterHashtable @{LogName=$ln;StartTime=(Get-Date).AddHours(-3)} -ErrorAction Stop |
                Where-Object {
                  $_.Id -in 4103,4104,400,403 -and (
                    $_.Message -match 'DesktopCommanderRemote|desktop-commander|Start-DesktopCommanderRemote|npx|wonderwhy'
                  )
                } | Select-Object -First 80 TimeCreated,Id,LevelDisplayName,Message | Format-List
            } catch { Write-Host ("READ_FAIL="+$_.Exception.Message) }
          }
