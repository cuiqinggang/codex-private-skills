name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect child-process evidence around failed DCR start
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $start=[datetime]'2026-10-03T22:09:30'
          $end=[datetime]'2026-10-03T22:11:20'
          Write-Host '=== POWERSHELL 4103/4104 WINDOW ==='
          foreach($ln in @('Microsoft-Windows-PowerShell/Operational','Windows PowerShell')){
            Write-Host ("--- "+$ln+" ---")
            try {
              Get-WinEvent -FilterHashtable @{LogName=$ln;StartTime=$start;EndTime=$end} -ErrorAction Stop |
                Where-Object {$_.Id -in 4103,4104} |
                Select-Object TimeCreated,Id,Message | Format-List
            } catch { Write-Host ("READ_FAIL="+$_.Exception.Message) }
          }
          Write-Host '=== APPLICATION ERRORS WINDOW ==='
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$start;EndTime=$end} -ErrorAction SilentlyContinue |
            Where-Object {$_.LevelDisplayName -in @('Error','Warning','错误','警告') -or $_.ProviderName -match 'Application Error|Windows Error Reporting|Node|PowerShell'} |
            Select-Object -First 80 TimeCreated,Id,ProviderName,LevelDisplayName,Message | Format-List
          Write-Host '=== SECURITY 4688 WINDOW ==='
          try {
            Get-WinEvent -FilterHashtable @{LogName='Security';Id=4688;StartTime=$start;EndTime=$end} -ErrorAction Stop |
              Where-Object {$_.Message -match 'powershell|node|npx|cmd|desktop-commander|DesktopCommander'} |
              Select-Object -First 80 TimeCreated,Id,Message | Format-List
          } catch { Write-Host ("SECURITY_READ_FAIL="+$_.Exception.Message) }
