name: LTMVH DCR Cross-Recovery Reality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltmvh-dcr-cross-recovery-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect and invoke existing DCR autostart task
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $name='GPT-DesktopCommander-Remote-Autostart'
          Write-Host "=== TASK DEFINITION ==="
          $t=Get-ScheduledTask -TaskName $name -ErrorAction SilentlyContinue
          if(-not $t){ throw "TASK_NOT_FOUND" }
          $t | Select-Object TaskName,TaskPath,State | Format-List
          Write-Host "=== PRINCIPAL ==="
          $t.Principal | Select-Object UserId,LogonType,RunLevel | Format-List
          Write-Host "=== ACTIONS ==="
          $t.Actions | Select-Object Execute,Arguments,WorkingDirectory | Format-List
          Write-Host "=== TRIGGERS ==="
          $t.Triggers | Format-List *
          Write-Host "=== TASK INFO BEFORE ==="
          Get-ScheduledTaskInfo -TaskName $name | Format-List *

          Write-Host "=== INVOKE TASK ==="
          try {
            Start-ScheduledTask -TaskName $name -ErrorAction Stop
            Write-Host "TASK_START_CALL=PASS"
          } catch {
            Write-Host ("TASK_START_CALL=FAIL "+$_.Exception.Message)
          }
          Start-Sleep -Seconds 12

          Write-Host "=== TASK INFO AFTER ==="
          Get-ScheduledTaskInfo -TaskName $name | Format-List *

          Write-Host "=== DCR PROCESS AFTER TASK ==="
          Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -and ($_.CommandLine -match 'desktop-commander|DesktopCommanderRemote|Start-DesktopCommanderRemote')
          } | Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | Format-List

          Write-Host "=== DCR EVENT/LOG CANDIDATES ==="
          Get-ChildItem 'C:\Users\A\AppData\Local\DesktopCommanderRemote' -Force -ErrorAction SilentlyContinue |
            Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize
