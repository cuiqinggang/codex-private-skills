name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 7
    steps:
      - name: Bootstrap fresh DCR identity and capture pairing flow
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\AI\DCR-PathA-v2'
          $freshHome=Join-Path $root 'home'
          $log=Join-Path $root 'remote-bootstrap.log'
          $err=Join-Path $root 'remote-bootstrap.err.log'
          New-Item -ItemType Directory -Force -Path $freshHome | Out-Null
          Remove-Item $log,$err -Force -ErrorAction SilentlyContinue

          $env:HOME=$freshHome
          $env:USERPROFILE=$freshHome
          $env:RUNNER_TRACKING_ID=''
          $npx=(Get-Command npx.cmd -ErrorAction Stop).Source

          Write-Host ('FRESH_HOME='+$freshHome)
          Write-Host ('DCR_VERSION='+(npm view '@wonderwhy-er/desktop-commander' version))
          $p=Start-Process -FilePath $npx -ArgumentList @('-y','@wonderwhy-er/desktop-commander@latest','remote') -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          Write-Host ('BOOTSTRAP_PID='+$p.Id)
          Start-Sleep -Seconds 25
          Write-Host ('BOOTSTRAP_ALIVE='+(-not $p.HasExited))
          if($p.HasExited){Write-Host ('BOOTSTRAP_EXIT='+$p.ExitCode)}
          Write-Host '=== BOOTSTRAP STDOUT ==='
          if(Test-Path $log){Get-Content -LiteralPath $log -Raw}
          Write-Host '=== BOOTSTRAP STDERR ==='
          if(Test-Path $err){Get-Content -LiteralPath $err -Raw}
          Write-Host '=== FRESH HOME TREE ==='
          Get-ChildItem $freshHome -Force -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime | Format-Table -AutoSize
          Write-Host '=== CDP TARGETS ==='
          try {
            (Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 'http://127.0.0.1:9223/json').Content
          } catch { Write-Host ('CDP_TARGETS_FAIL='+$_.Exception.Message) }
