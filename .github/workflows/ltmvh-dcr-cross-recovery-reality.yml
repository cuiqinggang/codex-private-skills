name: LTMVH DCR Cross-Recovery Reality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ltmvh-dcr-cross-recovery-reality.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect existing shared recovery runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\AI\LTMVH-Recovery'
          foreach($f in @('Recovery-Watchdog.ps1','Recover-LTMVH.ps1','Invoke-Recovery.ps1','Recovery-Request-Watchdog.ps1')){
            Write-Host ('=== '+$f+' ===')
            $p=Join-Path $root $f
            if(Test-Path $p){Get-Content -LiteralPath $p -Raw}
          }
          Write-Host '=== RECOVERY RELATED PROCESSES ==='
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match 'powershell|pwsh|node|cmd' -and $_.SessionId -eq 1} |
            Select-Object ProcessId,ParentProcessId,SessionId,Name,ExecutablePath,CommandLine | Format-List
          Write-Host '=== MUTEX/STATE FILES ==='
          foreach($f in @('recovery-state.json','last-recovery-state.json','request-watchdog.log','recovery.log')){
            $p=Join-Path $root $f
            if(Test-Path $p){Write-Host ('--- '+$f+' ---'); Get-Content -LiteralPath $p -Tail 100}
          }
