name: LTMVH DCR Cross-Recovery Reality

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltmvh-dcr-cross-recovery-reality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-dcr:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Test isolated user A scheduled-task bridge
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $name='LTMVH-UserBridge-Temp'
          $out='C:\AI\LTMVH-Recovery\user-bridge-temp.txt'
          Remove-Item $out -Force -ErrorAction SilentlyContinue
          try {
            Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction SilentlyContinue
            $action=New-ScheduledTaskAction -Execute 'powershell.exe' -Argument ('-NoProfile -WindowStyle Hidden -Command "'+[char]36+'env:USERNAME + ''|'' + (Get-Date).ToString(''o'') | Set-Content -LiteralPath '''+$out+''' -Encoding UTF8"')
            $principal=New-ScheduledTaskPrincipal -UserId 'A' -LogonType Interactive -RunLevel Limited
            Register-ScheduledTask -TaskName $name -Action $action -Principal $principal -Force -ErrorAction Stop | Out-Null
            Write-Host 'REGISTER_USER_BRIDGE=PASS'
            Start-ScheduledTask -TaskName $name -ErrorAction Stop
            Start-Sleep -Seconds 5
            if(Test-Path $out){
              Write-Host 'USER_BRIDGE_EXEC=PASS'
              Get-Content $out -Raw
            } else {
              Write-Host 'USER_BRIDGE_EXEC=FAIL_NO_OUTPUT'
            }
          } catch {
            Write-Host ('REGISTER_OR_RUN_FAIL='+$_.Exception.Message)
          } finally {
            try { Unregister-ScheduledTask -TaskName $name -Confirm:$false -ErrorAction Stop; Write-Host 'TEMP_TASK_CLEANUP=PASS' } catch { Write-Host ('TEMP_TASK_CLEANUP='+$_.Exception.Message) }
          }
