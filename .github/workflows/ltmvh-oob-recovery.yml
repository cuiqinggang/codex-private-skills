name: LTMVH Out-of-Band Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ltmvh-oob-recovery.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe or recover'
        required: false
        default: 'probe'
        type: string

permissions:
  contents: read

jobs:
  oob-recovery:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Probe local recovery surfaces without checkout
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\AI\LTMVH-Recovery'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dcr = @(Get-CimInstance Win32_Process | Where-Object {
            $_.CommandLine -match 'desktop-commander.*remote|Start-DesktopCommanderRemote'
          }).Count
          $runner = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -match 'RunnerService|Runner.Listener'
          }).Count
          $browser = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'chrome.exe' -and $_.ExecutablePath -like '*ms-playwright*'
          }).Count
          $port9223 = @(Get-NetTCPConnection -LocalPort 9223 -State Listen -ErrorAction SilentlyContinue).Count
          $startup = Join-Path ([Environment]::GetFolderPath('Startup')) 'GPT-DesktopCommander-Remote-Autostart.cmd'
          $result = [ordered]@{
            schemaVersion=1
            evidenceId='LTMVH-OOB-NO-CHECKOUT-R17'
            at=(Get-Date).ToString('o')
            machine=$env:COMPUTERNAME
            runnerName=$env:RUNNER_NAME
            dcrProcessCount=$dcr
            runnerProcessCount=$runner
            dedicatedBrowserProcessCount=$browser
            cdp9223ListenCount=$port9223
            dcrStartupExists=(Test-Path $startup)
            checkoutUsed=$false
            status='PASS'
          }
          $json=$result | ConvertTo-Json -Depth 5
          $json | Set-Content -LiteralPath (Join-Path $root 'OOB-NO-CHECKOUT-R17.json') -Encoding UTF8
          $json | Write-Host
