name: Windows Bridge V2 Bounded Native Artifact Candidate
on:
  workflow_dispatch:
    inputs:
      task_file:
        description: 'Existing, reviewed task JSON under bridge/tasks/'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: windows-v2-bounded-${{ inputs.task_file }}
  cancel-in-progress: false
jobs:
  windows-fast:
    outputs:
      task_id: ${{ steps.execute.outputs.task_id }}
      evidence_zip_b64: ${{ steps.execute.outputs.evidence_zip_b64 }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - name: Frozen fetch, validated execute, local result and remote receipt
        id: execute
        shell: pwsh
        env:
          GH_READ_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          TASK_PATH: ${{ inputs.task_file }}
        run: |
          $ErrorActionPreference='Stop'
          $all=[Diagnostics.Stopwatch]::StartNew()
          $root=Join-Path $env:RUNNER_TEMP ('bridge-v1-fast/'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $prefix='workspaces/extreme-time-automation-loop-v2.0/bridge/'
          if($env:TASK_PATH -notmatch '^workspaces/extreme-time-automation-loop-v2[.]0/bridge/tasks/[A-Za-z0-9._-]+[.]json$'){throw 'TASK_PATH_NOT_ALLOWED'}
          $headers=@{Authorization="Bearer $env:GH_READ_TOKEN";Accept='application/vnd.github+json'}
          function Receive-FrozenFile([string]$relative){
            if($relative -notmatch '^workspaces/extreme-time-automation-loop-v2[.]0/bridge/(tasks|payloads|runner)/[A-Za-z0-9._-]+[.](json|ps1)$'){throw 'UNAUTHORIZED_REPO_PATH'}
            $uri="$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/${relative}?ref=$env:COMMIT_SHA"
            $result=$null
            for($attempt=1;$attempt -le 2;$attempt++){
              try{$result=Invoke-RestMethod -Uri $uri -Headers $headers -TimeoutSec 18;break}
              catch{if($attempt -eq 2){throw};Start-Sleep -Seconds 1}
            }
            if($result.type -ne 'file' -or $result.encoding -ne 'base64'){throw 'INVALID_CONTENTS_RESPONSE'}
            $local=Join-Path $root ($relative.Replace('/','\'))
            New-Item -ItemType Directory -Force -Path (Split-Path $local) | Out-Null
            [IO.File]::WriteAllBytes($local,[Convert]::FromBase64String($result.content))
            return $local
          }
          Write-Host ('V1_FAST_ACCEPT_UTC='+[DateTime]::UtcNow.ToString('o')+';SHA='+$env:COMMIT_SHA)
          $taskLocal=Receive-FrozenFile $env:TASK_PATH
          $task=Get-Content -LiteralPath $taskLocal -Raw -Encoding utf8 | ConvertFrom-Json
          if($task.schema_version -ne 1 -or [string]$task.task_id -notmatch '^[A-Za-z0-9._-]{3,100}$'){throw 'INVALID_TASK_CONTRACT'}
          if([string]$task.payload_path -notmatch '^workspaces/extreme-time-automation-loop-v2[.]0/bridge/payloads/[A-Za-z0-9._-]+[.]ps1$'){throw 'INVALID_PAYLOAD_PATH'}
          if([int]$task.timeout_seconds -lt 1 -or [int]$task.timeout_seconds -gt 800){throw 'FAST_LANE_TASK_TIMEOUT_LIMIT'}
          Receive-FrozenFile ([string]$task.payload_path) | Out-Null
          $runner=Receive-FrozenFile ($prefix+'runner/Invoke-BridgeTask.ps1')
          Write-Host ('V1_FAST_FETCH_READY;TASK_ID='+$task.task_id+';ELAPSED_MS='+$all.ElapsedMilliseconds)
          $resultDir=Join-Path $root 'evidence'
          & pwsh -NoProfile -NonInteractive -File $runner -TaskFile $taskLocal -ResultDir $resultDir
          $exit=$LASTEXITCODE
          $resultFile=Join-Path $resultDir 'result.json'
          if(-not (Test-Path -LiteralPath $resultFile)){throw ('NO_RESULT_JSON;EXIT='+$exit)}
          $result=Get-Content -LiteralPath $resultFile -Raw -Encoding utf8 | ConvertFrom-Json
          if($result.task_id -ne $task.task_id){throw 'TASK_RECEIPT_MISMATCH'}
          $stdFile=Join-Path $resultDir 'stdout.txt'
          $errFile=Join-Path $resultDir 'stderr.txt'
          $stdoutHash=if(Test-Path -LiteralPath $stdFile){(Get-FileHash -LiteralPath $stdFile -Algorithm SHA256).Hash}else{'NONE'}
          $stderrBytes=if(Test-Path -LiteralPath $errFile){(Get-Item -LiteralPath $errFile).Length}else{-1}
          Write-Host ('V1_FAST_RESULT;TASK_ID='+$result.task_id+';STATUS='+$result.status+';EXIT='+$result.exit_code+';RUNNER='+$env:RUNNER_NAME+';PAYLOAD_MS='+$result.duration_ms+';TOTAL_STEP_MS='+$all.ElapsedMilliseconds+';STDOUT_SHA256='+$stdoutHash+';STDERR_BYTES='+$stderrBytes)
          if($result.status -ne 'PASS' -or $exit -ne 0){throw 'BRIDGE_FAST_EXECUTION_FAIL'}
          $archive=Join-Path $root 'evidence.zip'
          Compress-Archive -Path (Join-Path $resultDir '*') -DestinationPath $archive -Force
          $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($archive))
          if($b64.Length -gt 480000){throw ('EVIDENCE_TOO_LARGE_USE_ORIGINAL_FULL;B64_CHARS='+$b64.Length)}
          "task_id=$($result.task_id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "evidence_zip_b64=$b64" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host ('BOUNDED_EVIDENCE_HANDOFF=PASS;B64_CHARS='+$b64.Length)


  hosted-artifact:
    needs: windows-fast
    if: needs.windows-fast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Decode exact Windows evidence and validate receipt
        shell: bash
        env:
          EVIDENCE_B64: ${{ needs.windows-fast.outputs.evidence_zip_b64 }}
          EXPECTED_TASK_ID: ${{ needs.windows-fast.outputs.task_id }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import base64, io, json, os, pathlib, zipfile
          blob = base64.b64decode(os.environ["EVIDENCE_B64"], validate=True)
          if len(blob) > 360000: raise RuntimeError("BOUNDED_EVIDENCE_OVER_LIMIT")
          with zipfile.ZipFile(io.BytesIO(blob)) as z:
              names = set(z.namelist())
              if names != {"result.json","stdout.txt","stderr.txt"}: raise RuntimeError(f"EVIDENCE_FILES_MISMATCH: {names}")
              z.extractall("evidence")
          receipt = json.loads(pathlib.Path("evidence/result.json").read_text(encoding="utf-8-sig"))
          if receipt["task_id"] != os.environ["EXPECTED_TASK_ID"] or receipt["status"] != "PASS" or receipt["exit_code"] != 0:
              raise RuntimeError("EVIDENCE_RECEIPT_MISMATCH")
          print("HOSTED_EVIDENCE_DECODE_AND_VALIDATE=PASS")
          PY
      - name: Upload official Artifact from GitHub-hosted runner
        uses: actions/upload-artifact@v4
        with:
          name: etal-bridge-v2-bounded-${{ needs.windows-fast.outputs.task_id }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Optional original callback
        shell: bash
        env:
          CALLBACK_URL: ${{ secrets.ETAL_BRIDGE_CALLBACK_URL }}
        run: |
          if [ -z "$CALLBACK_URL" ]; then
            echo 'CALLBACK_NOT_CONFIGURED'
            exit 0
          fi
          curl --fail --show-error --silent --max-time 30 \
            -H 'Content-Type: application/json' -X POST \
            --data-binary @evidence/result.json "$CALLBACK_URL"
          echo 'CALLBACK_COMPLETED'
