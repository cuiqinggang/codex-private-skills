name: Bootstrap Desktop Commander Remote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-desktop-commander-remote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-remote:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Configure Desktop Commander Remote for interactive user
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $taskName='GPT-DesktopCommander-Remote-Autostart'
          $interactiveUser=(Get-CimInstance Win32_ComputerSystem).UserName
          if ([string]::IsNullOrWhiteSpace($interactiveUser)) { throw 'NO_INTERACTIVE_WINDOWS_USER' }

          $sid=(New-Object System.Security.Principal.NTAccount($interactiveUser)).Translate([System.Security.Principal.SecurityIdentifier]).Value
          $profile=(Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $sid } | Select-Object -First 1).LocalPath
          if ([string]::IsNullOrWhiteSpace($profile)) { throw "PROFILE_NOT_FOUND user=$interactiveUser" }

          $root='C:\actions-runner-etal\_local-tools\DesktopCommanderRemote'
          $launcher=Join-Path $root 'Start-DesktopCommanderRemote.ps1'
          $log=Join-Path $root 'remote.log'
          $session=Join-Path $profile '.desktop-commander-device\device.json'
          $npx=(Get-Command npx.cmd -ErrorAction Stop).Source

          New-Item -ItemType Directory -Path $root -Force | Out-Null

          $lines=@(
            "$" + "ErrorActionPreference='Continue'",
            "$" + "env:USERPROFILE='" + $profile.Replace("'","''") + "'",
            "$" + "HOME='" + $profile.Replace("'","''") + "'",
            "& '" + $npx.Replace("'","''") + "' -y '@wonderwhy-er/desktop-commander@latest' remote *>> '" + $log.Replace("'","''") + "'",
            "exit $" + "LASTEXITCODE"
          )
          Set-Content -LiteralPath $launcher -Value $lines -Encoding UTF8
          $existingTask=Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
          if($null -eq $existingTask){
            Write-Host 'DCR_AUTOSTART_TASK_EXISTS=NO'
            throw 'DCR_AUTOSTART_TASK_MISSING_REQUIRES_INTERACTIVE_ADMIN_RECREATE'
          }
          Write-Host 'DCR_AUTOSTART_TASK_EXISTS=YES'
          Start-ScheduledTask -TaskName $taskName

          Start-Sleep -Seconds 20

          $task=Get-ScheduledTask -TaskName $taskName
          $proc=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.CommandLine -match '(?i)desktop-commander' -and $_.CommandLine -match '(?i)remote'
          })

          Write-Host "DCR_TARGET_USER=$interactiveUser"
          Write-Host "DCR_AUTOSTART_TASK=$($task.State)"
          $ti=Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
          if($ti){
            Write-Host "DCR_TASK_LAST_RUN=$($ti.LastRunTime.ToString('o'))"
            Write-Host "DCR_TASK_LAST_RESULT=$($ti.LastTaskResult)"
            Write-Host "DCR_TASK_NEXT_RUN=$($ti.NextRunTime.ToString('o'))"
          }
          try {
            $sessionExists=Test-Path -LiteralPath $session -ErrorAction Stop
            Write-Host "DCR_SESSION_FILE_EXISTS=$sessionExists"
          } catch {
            Write-Host "DCR_SESSION_FILE_ACCESS=DENIED_OR_UNREADABLE"
          }
          Write-Host "DCR_MATCHING_PROCESSES=$($proc.Count)"
          Write-Host "DCR_LAUNCHER=$launcher"
          Write-Host "DCR_LOG=$log"
          if(Test-Path -LiteralPath $log){
            Write-Host '=== DCR_REMOTE_LOG_TAIL ==='
            Get-Content -LiteralPath $log -Tail 120 -ErrorAction SilentlyContinue
          } else {
            Write-Host 'DCR_REMOTE_LOG_EXISTS=NO'
          }
          # Service account may be denied access to the interactive user's persisted session.
          # Final validity is determined by remote online/ping, not by service-side file readability.
          if ($proc.Count -lt 1) { throw 'DESKTOP_COMMANDER_REMOTE_PROCESS_NOT_FOUND' }

# recovery-trigger: LTMVH-DCR-REBUILD-R25-20261003
