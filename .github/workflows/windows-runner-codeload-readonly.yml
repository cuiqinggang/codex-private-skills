name: Windows Runner Exact Action ZIP Through Existing FlClash (Read-Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-runner-exact-zip-readonly
  cancel-in-progress: false
jobs:
  exact-action-zip:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Compare original direct failure against exactly pinned archive via verified existing proxy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://codeload.github.com/actions/upload-artifact/zip/ea165f8d65b6e75b540449e92b4886f43607fa02'
          Write-Host 'TEST_MODE=READ_ONLY;ONE_EXACT_PINNED_ZIP;NO_RUNNER_OR_SYSTEM_PROXY_CHANGE'
          function Probe([string]$label,[bool]$useExistingProxy,[int]$timeout,[bool]$readWhole){
            $handler=[Net.Http.HttpClientHandler]::new()
            $handler.UseProxy=$useExistingProxy
            if($useExistingProxy){$handler.Proxy=[Net.WebProxy]::new('http://127.0.0.1:7890')}
            $client=[Net.Http.HttpClient]::new($handler)
            $client.Timeout=[TimeSpan]::FromSeconds($timeout)
            $sw=[Diagnostics.Stopwatch]::StartNew()
            try{
              if($readWhole){
                $response=$client.GetAsync($url).GetAwaiter().GetResult()
              }else{
                $response=$client.GetAsync($url,[Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
              }
              if(-not $response.IsSuccessStatusCode){throw ('HTTP_'+[int]$response.StatusCode)}
              if($readWhole){
                $bytes=$response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
                $zip=($bytes.Length -gt 10000 -and $bytes[0] -eq 80 -and $bytes[1] -eq 75)
                Write-Host ($label+'=HTTP_'+[int]$response.StatusCode+';BYTES='+$bytes.Length+';ZIP_MAGIC_OK='+$zip+';MS='+$sw.ElapsedMilliseconds)
              }else{
                Write-Host ($label+'=HEADERS_HTTP_'+[int]$response.StatusCode+';MS='+$sw.ElapsedMilliseconds)
              }
              $response.Dispose()
            }catch{
              $base=$_.Exception.GetBaseException()
              $kind=$base.GetType().Name
              if($base -is [Net.Sockets.SocketException]){$kind+='_'+$base.SocketErrorCode}
              Write-Host ($label+'=FAIL_'+$kind+';MS='+$sw.ElapsedMilliseconds)
            }finally{$client.Dispose()}
          }
          Probe 'EXACT_ZIP_DIRECT_HEADERS' $false 10 $false
          Probe 'EXACT_ZIP_EXISTING_FLCLASH_FULL_GET' $true 75 $true
          Write-Host 'PINNED_ZIP_DIFF_DONE'
