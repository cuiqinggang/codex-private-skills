name: Tunnel R2 Scoped Out-of-Band Status (Read Only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tunnel-r2-oob-readonly-20261014.yml'
permissions:
  contents: read
concurrency:
  group: tunnel-r2-oob-readonly
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Read local tunnel, guard and test results without touching processes
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $root='C:\AI\GPT-Windows-Bridge-B\persistence'
          Write-Host ('OOB_UTC='+[DateTimeOffset]::UtcNow.ToString('o'))
          $procs=@(Get-CimInstance Win32_Process -Filter "Name='tunnel-client.exe'")
          Write-Host ('TUNNEL_COUNT='+$procs.Count)
          foreach($p in $procs){ Write-Host ('TUNNEL_PID='+$p.ProcessId+';START='+$p.CreationDate+';NAME='+$p.Name) }
          $guard=Get-ScheduledTask -TaskName 'GPT-Windows-Tunnel-Pause-R2-ResumeGuard' -ErrorAction SilentlyContinue
          Write-Host ('PAUSE_R2_GUARD_PRESENT='+[bool]$guard)
          if($guard){Write-Host ('PAUSE_R2_GUARD_STATE='+$guard.State);$guard.Triggers|ForEach-Object{Write-Host ('PAUSE_R2_GUARD_AT='+$_.StartBoundary)}}
          $state=Join-Path $root 'Tunnel-Pause-R2.state.json'
          Write-Host ('R2_STATE_EXISTS='+(Test-Path -LiteralPath $state))
          foreach($name in @('Tunnel-Pause-R2.jsonl','Tunnel-Network-Test-R1.jsonl')){
            $file=Join-Path $root $name
            Write-Host ('FILE='+$name+';PRESENT='+(Test-Path -LiteralPath $file))
            if(Test-Path -LiteralPath $file){Get-Content -LiteralPath $file -Tail 18 -ErrorAction Continue | ForEach-Object { Write-Host ('EVENT='+$_) }}
          }
          $rule=@(Get-NetFirewallRule -Name 'GPT-Windows-Tunnel-TempBlock-R1' -ErrorAction SilentlyContinue)
          Write-Host ('TEMP_FIREWALL_RULES='+$rule.Count)
          # R3: scoped read-only evidence for post-R2 session recovery (no secrets printed)
          $activeLauncher='C:\AI\GPT-Windows-Bridge-B\Launch-OpenAI-Real-MCP.ps1'
          $candidateLauncher=Join-Path $root 'Launch-Initialized-Shim-Candidate.ps1'
          $flag='--mcp.stdio-send-initialized-notification'
          Write-Host ('R3_CURRENT_LAUNCHER_HAS_SHIM='+[bool]((Test-Path $activeLauncher) -and ((Get-Content $activeLauncher -Raw) -match [regex]::Escape($flag))))
          Write-Host ('R3_CANDIDATE_HAS_SHIM='+[bool]((Test-Path $candidateLauncher) -and ((Get-Content $candidateLauncher -Raw) -match [regex]::Escape($flag))))
          foreach($tp in $procs) {
            $argsAvailable= -not [string]::IsNullOrWhiteSpace($tp.CommandLine)
            Write-Host ('R3_PROCESS_PID='+$tp.ProcessId+';ARGS_READABLE='+$argsAvailable+';SHIM_FLAG='+$(if($argsAvailable){[bool]($tp.CommandLine -match [regex]::Escape($flag))}else{'unknown'}))
            $par=Get-CimInstance Win32_Process -Filter ("ProcessId="+$tp.ParentProcessId) -ErrorAction SilentlyContinue
            Write-Host ('R3_PARENT_PID='+$tp.ParentProcessId+';NAME='+$par.Name+';ALIVE='+[bool]$par)
          }
          $healthLog=Join-Path $root 'Tunnel-Health.jsonl'
          if(Test-Path $healthLog){Get-Content -LiteralPath $healthLog -Tail 4 | ForEach-Object { Write-Host ('R3_HEALTH='+$_) }}
          Write-Host ('R3_READONLY_COMPLETE')
          # A_RECOVERY_SUPERVISOR_AUDIT: only pre-existing Windows facilities and redacted event metadata
          Write-Host 'A_RECOVERY_SUPERVISOR_AUDIT'
          $recoveryTask=Get-ScheduledTask -TaskName 'GPT-Windows-Tunnel-Recovery-v1' -ErrorAction SilentlyContinue
          if($recoveryTask){
            $taskInfo=Get-ScheduledTaskInfo -TaskName $recoveryTask.TaskName -ErrorAction SilentlyContinue
            Write-Host ('RECOVERY_TASK_STATE='+$recoveryTask.State+';LAST_RESULT='+$taskInfo.LastTaskResult+';LAST_RUN='+$taskInfo.LastRunTime)
            foreach($action in @($recoveryTask.Actions)){
              $exe=[IO.Path]::GetFileName($action.Execute)
              Write-Host ('RECOVERY_TASK_EXECUTABLE='+$exe+';TARGETS_EXISTING_SUPERVISOR='+[bool]($action.Arguments -match 'Recovery-Supervisor-v1[.]ps1'))
            }
          }else{Write-Host 'RECOVERY_TASK_NOT_FOUND'}
          $supervisor=Join-Path $root 'Recovery-Supervisor-v1.jsonl'
          if(Test-Path -LiteralPath $supervisor){
            foreach($line in @(Get-Content -LiteralPath $supervisor -Tail 18 -ErrorAction SilentlyContinue)){
              try{
                $j=$line|ConvertFrom-Json
                Write-Host ('SUPERVISOR_EVENT='+$j.event+';UTC='+$j.utc+';PID='+$j.supervisor_pid+';DETAIL_TYPE='+$j.detail.GetType().Name)
              }catch{Write-Host 'SUPERVISOR_EVENT_UNPARSEABLE'}
            }
          }else{Write-Host 'SUPERVISOR_LOG_MISSING_OR_DENIED'}
          $report=Join-Path $root 'OneTunnel-Recovery-20261015.json'
          if(Test-Path -LiteralPath $report){
            try{$j=Get-Content -LiteralPath $report -Raw|ConvertFrom-Json;Write-Host ('PREVIOUS_CONTROLLED_RECOVERY='+$j.status+';OLD_PID='+$j.old_pid+';NEW_PID='+$j.new_pid)}
            catch{Write-Host 'PREVIOUS_CONTROLLED_RECOVERY_UNREADABLE'}
          }else{Write-Host 'PREVIOUS_CONTROLLED_RECOVERY_REPORT_NOT_VISIBLE'}
          # SUSPECTED_PS51_STDERR_RULE: only diagnostic exception type, never error text or credentials
          if(Test-Path -LiteralPath $supervisor){
            Get-Content -LiteralPath $supervisor -Tail 18 -ErrorAction SilentlyContinue | ForEach-Object {
              try {
                $ev=$_|ConvertFrom-Json
                if($ev.event -eq 'TUNNEL_EXCEPTION') {
                  $kind=([string]$ev.detail)
                  if($kind -notmatch '^[A-Za-z][A-Za-z0-9.]{0,80}'){$kind='REDACTED_UNEXPECTED_TYPE'}
                  Write-Host ('SUPERVISOR_EXCEPTION_KIND='+$kind+';UTC='+$ev.utc)
                }
              } catch {Write-Host 'SUPERVISOR_EXCEPTION_UNPARSEABLE'}
            }
          }
          $nativeCode='& cmd.exe /c "echo native-diagnostic-stderr 1>&2" 2>&1 | Out-Null'
          $safeRepro='$ErrorActionPreference="Stop";try{'+$nativeCode+';"TEST_RESULT=NO_EXCEPTION"}catch{"TEST_RESULT=EXCEPTION;TYPE="+$_.Exception.GetType().Name+";FQID="+$_.FullyQualifiedErrorId}'
          $repro=& powershell.exe -NoProfile -NonInteractive -Command $safeRepro 2>&1
          $repro|ForEach-Object {if(([string]$_) -match '^TEST_RESULT='){Write-Host ('POWERSHELL51_NATIVE_STDERR_'+$_)}}
          $src=Join-Path $root 'Recovery-Supervisor-v1.ps1'
          if(Test-Path -LiteralPath $src){Write-Host ('SUPERVISOR_CURRENT_SHA256='+(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash)}
          $fixedRepro='$ErrorActionPreference="Stop";try{& cmd.exe /c "echo native-diagnostic-stderr 1>&2" 1>$null 2>$null;"TEST_RESULT=NO_EXCEPTION"}catch{"TEST_RESULT=EXCEPTION;TYPE="+$_.Exception.GetType().Name}'
          $fixedOutput=& powershell.exe -NoProfile -NonInteractive -Command $fixedRepro 2>&1
          $fixedOutput|ForEach-Object {if(([string]$_) -match '^TEST_RESULT='){Write-Host ('POWERSHELL51_SEPARATE_STDERR_'+$_)}}
          $ps51Good='$ErrorActionPreference="Stop";try{$saved=$ErrorActionPreference;try{$ErrorActionPreference="Continue";& cmd.exe /c "echo native-diagnostic-stderr 1>&2" 2>&1|Out-Null;$code=$LASTEXITCODE}finally{$ErrorActionPreference=$saved};"PS002_GOOD_EXIT="+$code}catch{"PS002_GOOD_EXCEPTION="+$_.Exception.GetType().Name}'
          $ps51Bad='$ErrorActionPreference="Stop";try{$saved=$ErrorActionPreference;try{$ErrorActionPreference="Continue";& cmd.exe /c "exit /b 19" 2>&1|Out-Null;$code=$LASTEXITCODE}finally{$ErrorActionPreference=$saved};"PS002_BAD_EXIT="+$code}catch{"PS002_BAD_EXCEPTION="+$_.Exception.GetType().Name}'
          foreach($test in @($ps51Good,$ps51Bad)){
            $lines=& powershell.exe -NoProfile -NonInteractive -Command $test 2>&1
            $lines|ForEach-Object {if(([string]$_) -match '^PS002_'){Write-Host $_}}
          }
          Write-Host 'OOB_READONLY_COMPLETE'
# RERUN-20261015-V5-A-PATH-CURRENT-READONLY-DIAG: No runtime mutation; preserve existing tunnel.
