name: ETAL GPT Brain Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etal-gpt-brain-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest

      - name: Invoke GPT-5.6 Sol without tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot -p 'Do not use any tools. Return exactly this text and nothing else: ETAL_GPT_PROBE_PASS'             -s             --model gpt-5.6-sol             --disable-builtin-mcps             --excluded-tools='web_fetch,web_search,bash,edit,grep,glob,write,read,url,memory'             > response.txt
          cat response.txt
          test "$(tr -d '\r\n' < response.txt)" = "ETAL_GPT_PROBE_PASS"
