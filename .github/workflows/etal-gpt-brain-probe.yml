name: ETAL GPT Brain Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/etal-gpt-brain-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot@latest

      - name: Probe automatic model without tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot -p 'Do not use any tools. Return exactly this text and nothing else in the answer body: ETAL_GPT_AUTO_PROBE_PASS'             --disable-builtin-mcps             --excluded-tools='web_fetch,web_search,bash,edit,grep,glob,write,read,url,memory'
